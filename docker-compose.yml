version: '3.8'

services:
  app:
    build: .
    container_name: axismundi-app
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/axismundi
      RUST_LOG: debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  
  postgres:
    image: postgres:18
    container_name: axismundi-db
    environment:
      POSTGRES_DB: axismundi
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d axismundi"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: axismundi-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    container_name: axismundi-createbuckets-dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      S3_BUCKET_NAME: axismundi
    volumes:
      - ./resources:/tmp/resources:ro
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb local/$$S3_BUCKET_NAME --ignore-existing;
      mc anonymous set download local/$$S3_BUCKET_NAME;
      mc cp --recursive /tmp/resources/ local/$$S3_BUCKET_NAME/originals/;
      echo 'bucket setup complete';
      "
    restart: on-failure

  lexurgy:
    image: ghcr.io/auctumnus/lexurgy-services:latest
    ports:
      - "8080:8080"
    environment:
      # security - set this to a random string in production
      API_KEY: change-me-in-production
      SINGLE_STEP_TIMEOUT: 1
      REQUEST_TIMEOUT: 5
      TOTAL_TIMEOUT: 60

  imagor:
    image: shumc/imagor:latest
    container_name: axismundi-imagor
    ports:
      - "8888:8000"
    environment:
      PORT: 8000

      # security - set this to a random string in production
      IMAGOR_SECRET: change-me-in-production
      IMAGOR_UNSAFE: 1  # set to 0 in production

      # s3/minio credentials
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 1

      # loader (read source images from minio)
      S3_LOADER_BUCKET: axismundi

      # result storage (cache processed images in minio)
      S3_RESULT_STORAGE_BUCKET: axismundi
      S3_RESULT_STORAGE_BASE_DIR: results

      # quality
      IMAGOR_AUTO_WEBP: 1

      # http loader (proxying external images embedded in user markdown).
      # SSRF protection: block private/loopback/link-local networks at the
      # IP-resolution level (URL-string filtering is not enough — DNS rebinding
      # and alternate IP encodings defeat it). these checks fire on the
      # *resolved* address, including redirect targets.
      HTTP_LOADER_BLOCK_LOOPBACK_NETWORKS: 1
      HTTP_LOADER_BLOCK_PRIVATE_NETWORKS: 1
      HTTP_LOADER_BLOCK_LINK_LOCAL_NETWORKS: 1
      # cloud metadata endpoints (aws/gcp) — belt and braces, BLOCK_LINK_LOCAL
      # already covers 169.254.0.0/16 but explicit is nice.
      HTTP_LOADER_BLOCK_NETWORKS: "169.254.169.254/32"
      # force https; rejects http:// urls and prevents downgrade
      HTTP_LOADER_HTTPS_ONLY: 1
      # 10 MiB cap on fetched image size
      HTTP_LOADER_MAX_ALLOWED_SIZE: 10485760
      # only accept image/* responses
      HTTP_LOADER_ACCEPT: "image/*"
    depends_on:
      - minio
      - createbuckets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

version: '3.8'

services:
  app:
    build: .
    container_name: axismundi-app
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/axismundi
      RUST_LOG: debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  
  postgres:
    image: postgres:18
    container_name: axismundi-db
    environment:
      POSTGRES_DB: axismundi
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d axismundi"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: axismundi-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    container_name: axismundi-createbuckets-dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      S3_BUCKET_NAME: axismundi
    volumes:
      - ./resources:/tmp/resources:ro
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb local/$$S3_BUCKET_NAME --ignore-existing;
      mc anonymous set download local/$$S3_BUCKET_NAME;
      mc cp --recursive /tmp/resources/ local/$$S3_BUCKET_NAME/originals/;
      echo 'bucket setup complete';
      "
    restart: on-failure

  thumbor:
    image: beeyev/thumbor-s3:slim-alpine
    container_name: axismundi-thumbor
    ports:
      - "8888:8888"
    environment:
      # loader config (read images from s3)
      LOADER: thumbor_aws.loader
      AWS_LOADER_BUCKET_NAME: axismundi
      AWS_LOADER_S3_ACCESS_KEY_ID: minioadmin
      AWS_LOADER_S3_SECRET_ACCESS_KEY: minioadmin123
      AWS_LOADER_S3_ENDPOINT_URL: http://minio:9000
      AWS_LOADER_REGION_NAME: us-east-1

      # storage config (write processed images)
      STORAGE: thumbor_aws.storage
      AWS_STORAGE_BUCKET_NAME: axismundi
      AWS_STORAGE_S3_ACCESS_KEY_ID: minioadmin
      AWS_STORAGE_S3_SECRET_ACCESS_KEY: minioadmin123
      AWS_STORAGE_S3_ENDPOINT_URL: http://minio:9000
      AWS_STORAGE_REGION_NAME: us-east-1

      # result storage config (cache results)
      RESULT_STORAGE: thumbor_aws.result_storage
      AWS_RESULT_STORAGE_BUCKET_NAME: axismundi
      AWS_RESULT_STORAGE_S3_ACCESS_KEY_ID: minioadmin
      AWS_RESULT_STORAGE_S3_SECRET_ACCESS_KEY: minioadmin123
      AWS_RESULT_STORAGE_S3_ENDPOINT_URL: http://minio:9000
      AWS_RESULT_STORAGE_REGION_NAME: us-east-1
      
      # security - set this to a random string in production
      SECURITY_KEY: change-me-in-production
      ALLOW_UNSAFE_URL: "True"  # set to false in production
      
      # quality
      QUALITY: 85
      WEBP_QUALITY: 80
      AUTO_WEBP: "True"
      
      # caching
      RESULT_STORAGE_STORES_UNSAFE: "True"

      # logging
      LOG_LEVEL: debug
    depends_on:
      - minio
      - createbuckets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: axismundi-db
    environment:
      POSTGRES_DB: axismundi
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d axismundi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
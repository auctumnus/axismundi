[package]
name = "axismundi"
version = "0.1.0"
edition = "2024"
default-run = "axismundi"

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.4", features = ["macros"] }
chrono = { version = "0.4.41", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "chrono"] }
tokio = { version = "1.47.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["fs", "cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
askama = "0.14.0"
resend-rs = "0.15.0"
error_set = "0.8.5"
thiserror = "2.0.12"
regex = "1.11.1"
argon2 = "0.5.3"
validator = { version = "0.20", features = ["derive"] }
nanoid = "0.4.0"
sha2 = "0.10.9"
hmac-sha1 = "0.1.3"
base64 = "0.22.1"
zxcvbn = "3.1.0"
axum-extra = { version = "0.10.1", features = ["cookie", "multipart", "form"] }
dotenvy = "0.15.7"
rust-s3 = "0.35.1"
image = { version = "0.25.6", features = ["jpeg", "png", "gif", "avif", "webp", "rayon"] }
tower_governor = "0.7.0"
governor = "0.8.1"
serde_json = "1.0.141"
async-trait = "0.1.89"
serde_urlencoded = "0.7.1"
http-body-util = "0.1.3"
unicode-normalization = "0.1.24"
daggy = "0.9.0"
strum = { version = "0.27.2", features = ["derive"] }
bollard = "0.19.4"
reqwest = "0.12.24"
fast_image_resize = { version = "5.3.0", features = ["image"] }
rand = "0.8.5"
thumbor = "0.1.11"
chrono-humanize = "0.2.3"
slug = "0.1.6"

[dev-dependencies]
random_word = { version = "0.5.2", features = ["en"] }
reqwest = { version = "0.12.24" }

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
 
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:extra-editor:install --with-deps
      - run: bun run test:extra-editor:browser
        env:
          EXTRA_EDITOR_BROWSERS: chromium,firefox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: extra-editor-browser-failure
          path: frontend/test-results/extra-editor/
          if-no-files-found: ignore
  nix-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-compose-action@v1
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix develop --command python3 -B -m unittest discover -s scripts -p 'test_dev_services.py'
      - run: nix develop --command just test

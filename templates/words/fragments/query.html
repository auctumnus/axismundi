<section>
    <label for="word_class">Word class</label>
    <div class="select-container">
        <select id="word_class" name="word_class">
            <option value="">any</option>
            {% for wc in word_classes %}
                <option value="{{ wc.abbreviation }}" {% if query.word_class.as_ref() == Some(wc.abbreviation) %}selected{% endif %}>{{ wc.name }}</option>
            {% endfor %}
        </select>
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><!-- Icon from Material Symbols by Google - https://github.com/google/material-design-icons/blob/master/LICENSE --><path fill="currentColor" d="M12 14.975q-.2 0-.375-.062T11.3 14.7l-4.6-4.6q-.275-.275-.275-.7t.275-.7t.7-.275t.7.275l3.9 3.9l3.9-3.9q.275-.275.7-.275t.7.275t.275.7t-.275.7l-4.6 4.6q-.15.15-.325.213t-.375.062"/></svg>
    </div>
</section>

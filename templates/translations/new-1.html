{% extends "layout.html" %}
{%- import "util.html" as u -%}

{% block title %}new translation - axismundi{% endblock %}

{% block content %}
<h1>new translation</h1>

{% if let Some(error) = error %}
    <div class="error">
        <h2>Error</h2>
        <p class="error">{{ error.message }}</p>
    </div>
{% endif %}

<form class="default" method="post" action="/translatable/{{ translatable_id }}/new-translation">
    <section>
        <label for="language_code">Language to translate into</label>
        {% call u::field_error(name="language_code") %}
        <select id="language_code" name="language_code" required>
            <option value="" disabled selected>Select a language</option>
            {% for language in available_languages %}
                <option value="{{ language.code }}" {% if previous_language_code == language.code %}selected{% endif %}>{{ language.name }} ({{ language.code }})</option>
            {% endfor %}
        </select>
    </section>

    <input type="hidden" name="step" value="1">

    <button type="submit">Continue</button>
</form>

{% endblock %}

# edits made here should be reflected in the justfile and src/config.rs

services:
  postgres:
    image: postgres:18
    container_name: axismundi-db-test
    environment:
      POSTGRES_DB: axismundi_test
      POSTGRES_USER: user_test
      POSTGRES_PASSWORD: password
    ports:
      - "2435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_test -d axismundi_test"]
      interval: 10s
      timeout: 5s
      retries: 5
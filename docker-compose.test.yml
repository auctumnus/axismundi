# edits made here should be reflected in the justfile and src/config.rs

services:
  postgres:
    image: postgres:18
    container_name: axismundi-db-test
    environment:
      POSTGRES_DB: axismundi_test
      POSTGRES_USER: user_test
      POSTGRES_PASSWORD: password
    ports:
      - "2435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_test -d axismundi_test"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    container_name: axismundi-minio-test
    environment:
      MINIO_ROOT_USER: minioadmin_test
      MINIO_ROOT_PASSWORD: minioadmin123_test
    ports:
      - "7000:9000"
      - "7001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: axismundi-nginx-test
    ports:
      - "6060:80"
    volumes:
      - ./resources/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    container_name: axismundi-createbuckets-test
    environment:
      MINIO_ROOT_USER: minioadmin_test
      MINIO_ROOT_PASSWORD: minioadmin123_test
      S3_BUCKET_NAME: axismundi-test
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb local/$$S3_BUCKET_NAME;
      mc anonymous set download local/$$S3_BUCKET_NAME;
      "
    restart: on-failure

  thumbor:
    image: beeyev/thumbor-s3:slim-alpine
    container_name: axismundi-thumbor-test
    ports:
      - "7888:8888"
    environment:
      # loader config (read images from s3)
      LOADER: thumbor_aws.loader
      AWS_LOADER_BUCKET_NAME: axismundi-test
      AWS_LOADER_S3_ACCESS_KEY_ID: minioadmin_test
      AWS_LOADER_S3_SECRET_ACCESS_KEY: minioadmin123_test
      AWS_LOADER_S3_ENDPOINT_URL: http://minio:9000
      AWS_LOADER_REGION_NAME: us-east-1

      # storage config (write processed images)
      STORAGE: thumbor_aws.storage
      AWS_STORAGE_BUCKET_NAME: axismundi-test
      AWS_STORAGE_S3_ACCESS_KEY_ID: minioadmin_test
      AWS_STORAGE_S3_SECRET_ACCESS_KEY: minioadmin123_test
      AWS_STORAGE_S3_ENDPOINT_URL: http://minio:9000
      AWS_STORAGE_REGION_NAME: us-east-1

      # result storage config (cache results)
      RESULT_STORAGE: thumbor_aws.result_storage
      AWS_RESULT_STORAGE_BUCKET_NAME: axismundi-test
      AWS_RESULT_STORAGE_S3_ACCESS_KEY_ID: minioadmin_test
      AWS_RESULT_STORAGE_S3_SECRET_ACCESS_KEY: minioadmin123_test
      AWS_RESULT_STORAGE_S3_ENDPOINT_URL: http://minio:9000
      AWS_RESULT_STORAGE_REGION_NAME: us-east-1

      # security
      SECURITY_KEY: change-me-in-production
      ALLOW_UNSAFE_URL: "True"

      # quality
      QUALITY: 85
      WEBP_QUALITY: 80
      AUTO_WEBP: "True"

      # caching
      RESULT_STORAGE_STORES_UNSAFE: "True"

      # logging
      LOG_LEVEL: warning
    depends_on:
      - minio
      - createbuckets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
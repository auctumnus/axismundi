# edits made here should be reflected in the justfile and src/config.rs

services:
  postgres:
    image: postgres:18
    container_name: axismundi-db-test
    environment:
      POSTGRES_DB: axismundi_test
      POSTGRES_USER: user_test
      POSTGRES_PASSWORD: password
    ports:
      - "2435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_test -d axismundi_test"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    container_name: axismundi-minio-test
    environment:
      MINIO_ROOT_USER: minioadmin_test
      MINIO_ROOT_PASSWORD: minioadmin123_test
    ports:
      - "7000:9000"
      - "7001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: axismundi-nginx-test
    ports:
      - "6060:80"
    volumes:
      - ./resources/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - minio
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    container_name: axismundi-createbuckets-test
    environment:
      MINIO_ROOT_USER: minioadmin_test
      MINIO_ROOT_PASSWORD: minioadmin123_test
      S3_BUCKET_NAME: axismundi-test
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb local/$$S3_BUCKET_NAME;
      mc anonymous set download local/$$S3_BUCKET_NAME;
      "
    restart: on-failure

  lexurgy:
    image: ghcr.io/auctumnus/lexurgy-services:latest
    ports:
      - "4000:8080"
    environment:
      API_KEY: change-me-in-production
      SINGLE_STEP_TIMEOUT: 1
      REQUEST_TIMEOUT: 5
      TOTAL_TIMEOUT: 60

  imagor:
    image: shumc/imagor:latest
    container_name: axismundi-imagor-test
    ports:
      - "7888:8000"
    environment:
      PORT: 8000

      # security
      IMAGOR_SECRET: change-me-in-production
      IMAGOR_UNSAFE: 1

      # s3/minio credentials
      AWS_ACCESS_KEY_ID: minioadmin_test
      AWS_SECRET_ACCESS_KEY: minioadmin123_test
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 1

      # loader (read source images from minio)
      S3_LOADER_BUCKET: axismundi-test

      # result storage (cache processed images in minio)
      S3_RESULT_STORAGE_BUCKET: axismundi-test
      S3_RESULT_STORAGE_BASE_DIR: results

      # quality
      IMAGOR_AUTO_WEBP: 1
    depends_on:
      - minio
      - createbuckets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped